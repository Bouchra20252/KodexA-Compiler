<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #e0e7ff, #f0f4f8);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .sign-up-container {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
    }

    .sign-up-container h2 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #4b5563;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
      background-color: #f9fafb;
      transition: border 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #3b82f6;
      outline: none;
    }

    .btn {
      width: 100%;
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background-color: #2563eb;
    }

    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #6b7280;
    }

    .footer a {
      color: #3b82f6;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .error {
      color: red;
      font-size: 14px;
      margin-top: -15px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="sign-up-container">
    <h2>Create Account</h2>
    <form id="sign-upForm" action="/sign-up" method="POST" onsubmit="return validatePasswords()">
      <div class="form-group">
        <label for="username"> Username</label>
        <input type="text" id="username" name="username" required />
      </div>
<!-- Add inside sign-up.html -->
<p style="color: #f43f5e; text-align: center; margin-top: 10px;">
  ⚠ Your file exceeded 3KB. Please sign up to continue.
</p>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required />
        <div class="error" id="errorText"></div>
      </div>

      <button type="submit" class="btn">Sign Up</button>
    </form>
    <div class="footer">
      Already have an account? <a href="/login.html">Log in</a>
    </div>
  </div>

  <script>
    function validatePasswords() {
      const pass1 = document.getElementById("password").value;
      const pass2 = document.getElementById("confirmPassword").value;
      const errorText = document.getElementById("errorText");

      if (pass1 !== pass2) {
        errorText.textContent = "Passwords do not match.";
        return false;
      }
      errorText.textContent = "";
      return true;
    }
  </script>
</body>
</html>
