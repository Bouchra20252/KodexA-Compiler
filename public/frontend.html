<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Compiler</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #dbeafe, #f0f4ff);
      margin: 0;
      padding: 40px;
    }

    .container {
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      padding: 40px;
      width: 90%;
      max-width: 1200px;
      margin: auto;
      border: 2px solid #d1d5db;
      position: relative;
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #3b82f6;
      font-size: 32px;
    }

    label {
      display: block;
      margin-top: 25px;
      font-weight: bold;
      color: #4b5563;
      font-size: 16px;
    }

    input[type="file"] {
      margin-top: 10px;
      padding: 8px;
      display: block;
    }

    textarea {
      width: 100%;
      height: 300px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 15px;
      padding: 14px;
      border: 2px solid #93c5fd;
      border-radius: 10px;
      background-color: #f0f9ff;
      color: #111827;
      transition: border 0.3s;
    }

    textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }

    button {
      display: block;
      margin: 30px auto 0;
      padding: 14px 28px;
      background: linear-gradient(to right, #6366f1, #3b82f6);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: linear-gradient(to right, #4f46e5, #2563eb);
      transform: scale(1.03);
    }

    h3 {
      margin-top: 40px;
      color: #1f2937;
      font-size: 20px;
    }

    .output {
      background-color: #0f172a;
      color: #10b981;
      padding: 20px;
      border-radius: 12px;
      margin-top: 10px;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      overflow-x: auto;
      border: 2px solid #334155;
    }

    /* History Button */
    #history-button {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: linear-gradient(to right, #6366f1, #3b82f6);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    #history-button:hover {
      background: linear-gradient(to right, #4f46e5, #2563eb);
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      padding-top: 60px;
    }

    /* Modal Content */
    .modal-content {
      background-color: #fff;
      margin: 5% auto;
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      max-width: 900px;
      position: relative;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 30px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
    }

    /* SignUp/LogIn Modal */
    .sign-up-login-modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
      padding-top: 60px;
    }

    .sign-up-login-modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      border-radius: 10px;
      width: 50%;
      text-align: center;
    }

    .sign-up-login-modal button {
      margin: 10px;
      padding: 12px 25px;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .sign-up-login-modal button:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mini Compiler</h1>
    <form id="compiler-form">
      <label> Upload a file:</label>
      <input type="file" name="file" id="file">

      <label>Or write your code below:</label>
      <textarea name="code" id="code" placeholder="Write your code here..."></textarea>

      <button type="submit"> Run Code</button>
    </form>

    <h3>Output:</h3>
    <div class="output" id="output">Waiting for code...</div>

    <!-- History Button -->
    <button id="history-button">Show History</button>
  </div>

  <!-- Modal for History -->
  <div id="historyModal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <h2>Execution History</h2>
      <div id="history-list">
        <!-- History items will be injected here -->
      </div>
    </div>
  </div>

  <!-- Sign Up / Log In Modal -->
  <div id="signUpLoginModal" class="sign-up-login-modal">
    <div class="sign-up-login-modal-content">
      <h2>Your file is too large!</h2>
      <p>Please sign up or log in to continue.</p>
      <button id="signUpButton">Sign Up</button>
      <button id="logInButton">Log In</button>
    </div>
  </div>

  <script>
    // Check if file size is larger than 3KB
    document.getElementById('compiler-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const fileInput = document.getElementById('file');
      const file = fileInput.files[0];

      if (file && file.size > 3072) {  // 3KB in bytes
        // Show the sign-up/login modal
        document.getElementById('signUpLoginModal').style.display = 'block';
        return;
      }

      const form = new FormData(this);
      const response = await fetch('/run-code', {
        method: 'POST',
        body: form
      });

      const result = await response.json();
      document.getElementById('output').textContent = `Language: ${result.language}\n\n${result.output}`;
    });

    // Show History Modal
    document.getElementById('history-button').addEventListener('click', function () {
      document.getElementById('historyModal').style.display = 'block';
    });

    // Close the History Modal
    document.getElementById('closeModal').addEventListener('click', function () {
      document.getElementById('historyModal').style.display = 'none';
    });

    // Redirect to Sign Up or Log In page
    document.getElementById('signUpButton').addEventListener('click', function () {
      window.location.href = '/sign-up';  // Redirect to sign-up page
    });

    document.getElementById('logInButton').addEventListener('click', function () {
      window.location.href = '/log-in';  // Redirect to log-in page
    });
  </script>
</body>
</html>
